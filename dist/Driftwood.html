<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Driftwood — Survival at Sea</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b3542'/%3E%3Cpath d='M18 13h14c13 0 20 7 20 19S45 51 32 51H18V13zm12 9v20h3c6 0 9-3 9-10s-3-10-9-10h-3z' fill='%23e9c883'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<meta name="theme-color" content="#071b24"><meta name="description" content="Driftwood — a rich 3D survival life aboard an endless sea.">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Marcellus&display=swap" rel="stylesheet">
<style>:root{--ink:#0c2830;--ink2:#2b4a52;--glass:rgba(7,27,35,.64);--glass2:rgba(7,25,33,.88);--line:rgba(222,239,240,.15);--txt:#f2f6f5;--mut:rgba(224,236,235,.64);--acc:#e9c883;--acc2:#d79c58;--good:#81c9a0;--bad:#ef7c74;--hp:#e9797d;--food:#dfa563;--wat:#69b8d2;--r:13px;--fd:'Manrope',system-ui,sans-serif;--fb:'Manrope',system-ui,sans-serif;--display:'Marcellus',Georgia,serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0b2a35;font-family:var(--fb);color:var(--txt);user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
svg{width:100%;height:100%;display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
kbd{font-family:var(--fd);font-weight:600;font-size:.8em;display:inline-flex;align-items:center;justify-content:center;min-width:1.7em;height:1.7em;padding:0 .4em;border-radius:6px;background:rgba(255,255,255,.92);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
[hidden]{display:none!important}
.glass{background:var(--glass);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 30px rgba(0,20,30,.18)}
#vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,25,35,.38) 100%)}
#fade{position:fixed;inset:0;background:#06202a;pointer-events:none;opacity:0;transition:opacity .6s ease;z-index:50}
#fade.on{opacity:1;pointer-events:all}
/* loading */
#loading{position:fixed;inset:0;z-index:60;background:radial-gradient(circle at 50% 40%,#1b8fb0,#0a3a4c);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .8s}
#loading.done{opacity:0;pointer-events:none}
.load-logo{font-family:var(--fd);font-weight:700;font-size:64px;letter-spacing:.01em;text-shadow:0 6px 30px rgba(0,0,0,.25)}
.load-bar{width:260px;height:8px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}.load-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,#ffd166);border-radius:9px;transition:width .3s}
.load-tip{color:var(--mut);font-weight:700}
/* title */
.screen{position:fixed;inset:0;z-index:10}
#title{background:linear-gradient(90deg,rgba(6,34,46,.62) 0%,rgba(6,34,46,.28) 34%,rgba(6,34,46,0) 55%);display:flex;flex-direction:column;justify-content:center;padding:0 7vw;animation:fadein 1s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.title-left{max-width:440px}
.logo{display:flex;align-items:center;gap:18px;margin-bottom:44px}
.logo-badge{width:74px;height:74px;border-radius:22px;background:linear-gradient(145deg,#ffd166,#ff9f43);display:grid;place-items:center;font-family:var(--fd);font-weight:700;font-size:44px;color:#5a2e0c;box-shadow:0 10px 30px rgba(255,160,60,.35),inset 0 -4px 0 rgba(0,0,0,.12);transform:rotate(-6deg)}
.logo h1{margin:0;font-family:var(--fd);font-weight:700;font-size:72px;line-height:.95;letter-spacing:-.01em;text-shadow:0 4px 24px rgba(0,30,40,.35)}
.logo p{margin:8px 0 0;font-weight:700;color:rgba(255,255,255,.85);font-size:17px}
.menu{display:flex;flex-direction:column;gap:12px}
.mbtn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:15px 22px;border-radius:16px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .18s,background .18s,border-color .18s;width:100%}
.mbtn:hover,.mbtn:focus-visible{transform:translateX(8px);background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.35);outline:none}
.mbtn.primary{background:linear-gradient(135deg,#ffd166,#ffab4c);color:#4a2608;border-color:transparent;box-shadow:0 10px 30px rgba(255,160,60,.3)}
.mbtn.primary .mb-s{color:rgba(74,38,8,.7)}
.mb-t{font-family:var(--fd);font-weight:600;font-size:22px}.mb-s{font-size:13.5px;color:var(--mut);font-weight:700;margin-top:2px}
.title-foot{position:absolute;bottom:24px;left:7vw;right:7vw;display:flex;justify-content:space-between;color:rgba(255,255,255,.55);font-size:13px;font-weight:700}
/* modals */
#modals{position:fixed;inset:0;z-index:40;pointer-events:none}
.modal-back{position:absolute;inset:0;background:rgba(4,24,32,.45);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;pointer-events:all;animation:fadein .25s}
.modal{width:min(560px,92vw);max-height:88vh;overflow:auto;background:rgba(12,42,52,.86);border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
.modal.wide{width:min(860px,94vw)}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 4px;font-family:var(--fd);font-weight:600;font-size:30px}.modal .sub{color:var(--mut);font-weight:700;margin:0 0 20px}
.mhead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.xbtn{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.1);padding:9px;flex:none}.xbtn:hover{background:rgba(255,255,255,.2)}
.field{margin:14px 0}.field label{display:block;font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin-bottom:8px}
.input{width:100%;padding:13px 15px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:#fff;font:700 17px var(--fb);outline:none}.input:focus{border-color:var(--acc)}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:8px}.seg button{padding:12px;border-radius:12px;background:rgba(255,255,255,.07);border:1px solid var(--line);text-align:left}.seg button b{display:block;font-family:var(--fd);font-weight:600;font-size:17px}.seg button span{font-size:12.5px;color:var(--mut);font-weight:700}
.seg button.on{background:rgba(255,209,102,.16);border-color:var(--acc)}
.btns{display:flex;gap:10px;justify-content:flex-end;margin-top:22px;flex-wrap:wrap}
.btn{padding:12px 22px;border-radius:13px;font-family:var(--fd);font-weight:600;font-size:17px;background:rgba(255,255,255,.12);border:1px solid var(--line);transition:transform .12s,background .15s}.btn:hover{background:rgba(255,255,255,.2)}.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,#ffd166,#ffab4c);color:#4a2608;border-color:transparent}.btn.pri:hover{filter:brightness(1.06)}
.btn.danger{background:rgba(255,107,107,.18);border-color:rgba(255,107,107,.5);color:#ffd0d0}
.btn:disabled{opacity:.4;pointer-events:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.07)}.row:last-child{border:0}
.row .lbl{font-weight:800}.row input[type=range]{width:200px;accent-color:#ffd166}
select.input{width:200px;padding:9px 12px;font-size:15px}select.input option{background:#123}
.toggle{width:48px;height:28px;border-radius:20px;background:rgba(255,255,255,.18);position:relative;transition:.2s}.toggle::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}.toggle.on{background:var(--good)}.toggle.on::after{left:23px}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:8px 22px;margin:8px 0 16px}.keys div{display:flex;gap:10px;align-items:center;font-weight:700;color:rgba(255,255,255,.9)}.keys kbd{flex:none}
.tips{margin:0;padding-left:18px;color:rgba(255,255,255,.88);font-weight:700;line-height:1.6}
.pause-menu{display:flex;flex-direction:column;gap:10px;margin-top:10px}.pause-menu .btn{text-align:left;padding:15px 20px}
/* HUD */
#hud{position:fixed;inset:0;z-index:5;pointer-events:none}
#hud>*{pointer-events:auto}
#clock{position:absolute;top:20px;left:20px;display:flex;align-items:center;gap:12px;padding:10px 18px 10px 12px}
.clk-ico{width:40px;height:40px;border-radius:12px;background:rgba(255,209,102,.2);color:var(--acc);padding:8px}
.clk-ico.night{background:rgba(160,180,255,.18);color:#cfd8ff}.clk-ico.rain{background:rgba(180,210,230,.2);color:#d9ecf7}
.clk-day{font-family:var(--fd);font-weight:600;font-size:19px;line-height:1.1}.clk-time{font-weight:800;font-size:13px;color:var(--mut);display:flex;gap:6px}.dot{opacity:.5}
#topRight{position:absolute;top:20px;right:20px;display:flex;gap:10px;align-items:flex-start}
#res{display:flex;padding:6px;gap:2px}
.rs{display:flex;align-items:center;gap:7px;padding:6px 11px;border-radius:11px;font-weight:900;font-size:15px;transition:background .3s}
.rs i{width:20px;height:20px;display:block}.rs.coin{background:rgba(255,209,102,.14);color:#ffe08a}.rs.flash{background:rgba(255,255,255,.25)}
.ibtn{width:46px;height:46px;padding:11px;border-radius:14px}.ibtn:hover{background:var(--glass2)}
#quest{position:absolute;top:84px;right:20px;width:280px;padding:15px 16px}
.q-lab{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}.q-lab i{width:14px;height:14px}
.q-t{font-family:var(--fd);font-weight:600;font-size:18px;margin:6px 0 3px;line-height:1.2}.q-d{font-size:13px;color:var(--mut);font-weight:700;line-height:1.4}
.q-bar{height:6px;border-radius:6px;background:rgba(255,255,255,.14);margin-top:11px;overflow:hidden}.q-bar i{display:block;height:100%;background:linear-gradient(90deg,#ffd166,#ff9f43);border-radius:6px;transition:width .4s}
.q-foot{display:flex;justify-content:space-between;margin-top:7px;font-size:12px;font-weight:800;color:var(--mut)}
#quest.done{animation:qdone 1s}@keyframes qdone{30%{transform:scale(1.04);border-color:var(--acc)}}
#vitals{position:absolute;left:20px;bottom:20px;display:flex;gap:10px}
.vit{width:64px;height:64px;position:relative;border-radius:50%;background:var(--glass);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line)}
.vit svg.ring{position:absolute;inset:3px;width:calc(100% - 6px);height:calc(100% - 6px);transform:rotate(-90deg)}
.vit .ic{position:absolute;inset:0;margin:auto;width:24px;height:24px;top:-9px}
.vit .num{position:absolute;bottom:9px;left:0;right:0;text-align:center;font-weight:900;font-size:12px}
.vit.low{animation:pulse 1s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,107,107,.25)}}
#hotbar{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:20px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line)}
.slot{width:62px;height:62px;border-radius:14px;background:rgba(255,255,255,.07);border:2px solid transparent;position:relative;display:flex;align-items:center;justify-content:center;transition:transform .15s,border-color .15s,background .15s}
.slot:hover{background:rgba(255,255,255,.14)}.slot.on{border-color:var(--acc);background:rgba(255,209,102,.14);transform:translateY(-4px)}
.slot i{width:30px;height:30px;display:block}.slot .k{position:absolute;top:4px;left:7px;font-size:11px;font-weight:900;color:var(--mut)}.slot .c{position:absolute;bottom:4px;right:7px;font-size:12.5px;font-weight:900}
.slot .nm{position:absolute;bottom:calc(100% + 10px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:12.5px;font-weight:800;background:var(--glass2);padding:4px 9px;border-radius:8px;opacity:0;pointer-events:none;transition:.15s}.slot:hover .nm{opacity:1}
.slot.dim i{opacity:.45}
#prompt{position:absolute;left:50%;bottom:112px;transform:translateX(-50%);display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;border-radius:14px;background:var(--glass2);backdrop-filter:blur(12px);border:1px solid var(--line);font-weight:800;font-size:15px;opacity:0;transition:opacity .15s,transform .15s;pointer-events:none}
#prompt.on{opacity:1;pointer-events:auto;cursor:pointer}#prompt.off{color:var(--mut)}#prompt.off kbd{background:rgba(255,255,255,.4)}
#prompt i{width:20px;height:20px;display:block;color:var(--acc)}
#pickups{position:absolute;left:20px;bottom:104px;display:flex;flex-direction:column-reverse;gap:6px;pointer-events:none}
.pk{display:flex;align-items:center;gap:9px;padding:7px 13px 7px 8px;border-radius:12px;background:var(--glass2);backdrop-filter:blur(10px);border:1px solid var(--line);font-weight:800;font-size:14px;animation:pkin .3s cubic-bezier(.2,1.4,.4,1),pkout .4s 2.6s forwards}
.pk i{width:22px;height:22px;display:block}.pk b{color:var(--good)}.pk.neg b{color:var(--bad)}
@keyframes pkin{from{transform:translateX(-30px);opacity:0}}@keyframes pkout{to{opacity:0;transform:translateX(-20px)}}
#banner{position:absolute;top:22%;left:50%;transform:translateX(-50%);text-align:center;pointer-events:none}
.bn{animation:bnin .5s cubic-bezier(.2,1.3,.4,1),pkout .6s 3.2s forwards;padding:14px 28px;border-radius:18px;background:var(--glass2);backdrop-filter:blur(12px);border:1px solid var(--line)}
.bn .bt{font-family:var(--fd);font-weight:600;font-size:28px}.bn .bs{font-weight:700;color:var(--mut);margin-top:2px}.bn.warn{border-color:rgba(255,107,107,.6)}.bn.warn .bt{color:#ffb3b3}.bn.gold{border-color:rgba(255,209,102,.7)}.bn.gold .bt{color:var(--acc)}
@keyframes bnin{from{transform:translateY(-14px) scale(.95);opacity:0}}
#markers{position:absolute;inset:0;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:3px;transition:opacity .2s}
.mk .b{width:34px;height:34px;border-radius:50%;background:var(--glass2);backdrop-filter:blur(8px);border:1px solid var(--line);padding:7px;position:relative}
.mk .b svg.pr{position:absolute;inset:-3px;width:40px;height:40px;transform:rotate(-90deg)}
.mk.ready .b{background:linear-gradient(135deg,#7bd88f,#3fb46a);border-color:transparent;animation:bob 1.2s ease-in-out infinite}
.mk.warn .b{background:linear-gradient(135deg,#ff6b6b,#d63b3b);border-color:transparent;animation:bob .5s ease-in-out infinite}
.mk .l{font-size:11.5px;font-weight:900;padding:2px 7px;border-radius:7px;background:var(--glass2);white-space:nowrap}
@keyframes bob{50%{transform:translateY(-4px)}}
#buildbar{position:absolute;left:50%;bottom:104px;transform:translateX(-50%);padding:10px;display:flex;gap:8px;max-width:94vw;overflow-x:auto}
.bc{width:118px;flex:none;padding:10px;border-radius:13px;background:rgba(255,255,255,.07);border:2px solid transparent;text-align:left;transition:.15s}
.bc:hover{background:rgba(255,255,255,.14)}.bc.on{border-color:var(--acc);background:rgba(255,209,102,.12)}.bc.no{opacity:.55}
.bc .bi{width:28px;height:28px;color:var(--acc);margin-bottom:6px}.bc .bn2{font-family:var(--fd);font-weight:600;font-size:14.5px;line-height:1.15}
.bc .cost{display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:6px}.bc .cost span{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:900}.bc .cost i{width:14px;height:14px;display:block}.bc .cost span.lack{color:var(--bad)}
.bc.lock .bn2::after{content:' · LOCKED';font-size:8px;letter-spacing:.08em}
#fishbar{position:absolute;left:50%;top:58%;transform:translateX(-50%);width:min(420px,86vw);padding:16px 18px;border-radius:18px;background:var(--glass2);backdrop-filter:blur(12px);border:1px solid var(--line);text-align:center}
.fb-title{font-family:var(--fd);font-weight:600;font-size:20px;margin-bottom:10px}.fb-track{position:relative;height:24px;border-radius:12px;background:rgba(255,255,255,.12);overflow:hidden}
.fb-zone{position:absolute;top:0;bottom:0;background:linear-gradient(90deg,#7bd88f,#3fb46a);border-radius:10px}.fb-mark{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:#fff;border-radius:4px;box-shadow:0 0 10px #fff}
.fb-hint{margin-top:9px;font-size:13px;font-weight:700;color:var(--mut)}
#tooltip{position:absolute;pointer-events:none;padding:7px 11px;border-radius:10px;background:var(--glass2);backdrop-filter:blur(8px);border:1px solid var(--line);font-weight:800;font-size:13px;white-space:nowrap;transform:translate(14px,14px);opacity:0;transition:opacity .12s}
#tooltip.on{opacity:1}#tooltip small{display:block;color:var(--mut);font-weight:700}
#hint{position:absolute;right:20px;bottom:24px;font-size:12.5px;font-weight:700;color:rgba(255,255,255,.7);text-shadow:0 1px 6px rgba(0,0,0,.4);pointer-events:none;max-width:260px;text-align:right}
#fps{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:30;font:800 12px var(--fb);background:rgba(0,0,0,.4);padding:3px 8px;border-radius:7px}
/* panels */
.inv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.it{padding:12px 10px;border-radius:14px;background:rgba(255,255,255,.07);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}.it i{width:32px;height:32px;display:block}.it b{font-size:20px;font-family:var(--fd);font-weight:600}.it span{font-size:12px;font-weight:800;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:4px 0 16px;flex-wrap:wrap}.tabs button{padding:8px 15px;border-radius:11px;font-weight:800;background:rgba(255,255,255,.07)}.tabs button.on{background:var(--acc);color:var(--ink)}
.ql{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.05);margin-bottom:6px}.ql .ck{width:26px;height:26px;border-radius:50%;border:2px solid rgba(255,255,255,.25);padding:3px;flex:none}.ql.done .ck{background:var(--good);border-color:var(--good);color:var(--ink)}.ql.cur{border:1px solid var(--acc)}.ql.done .qt{opacity:.6;text-decoration:line-through}.ql .qt{font-weight:800}.ql.lock{opacity:.35}
.shop-list{display:flex;flex-direction:column;gap:7px}
.sh{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:13px;background:rgba(255,255,255,.06)}.sh i{width:32px;height:32px;flex:none;display:block}.sh .sn{flex:1}.sh .sn b{display:block;font-family:var(--fd);font-weight:600;font-size:16.5px}.sh .sn span{font-size:12.5px;color:var(--mut);font-weight:700}
.sh .price{display:flex;align-items:center;gap:4px;font-weight:900;color:#ffe08a}.sh .price i{width:16px;height:16px}
.sh .btn{padding:8px 14px;font-size:15px}
.trader-head{display:flex;gap:14px;align-items:center;margin-bottom:16px;padding:12px;border-radius:14px;background:rgba(255,209,102,.1)}.trader-head .av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#ffd166,#ff9f43);color:#5a2e0c;padding:11px;flex:none}.trader-head q{font-weight:700;font-style:italic;color:rgba(255,255,255,.88)}
.coinbal{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:11px;background:rgba(255,209,102,.15);color:#ffe08a;font-weight:900}.coinbal i{width:18px;height:18px}
.away-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:10px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stats div{padding:12px;border-radius:12px;background:rgba(255,255,255,.06)}.stats b{display:block;font-family:var(--fd);font-weight:600;font-size:22px}.stats span{font-size:12.5px;font-weight:800;color:var(--mut)}
/* mobile */
#joy{position:absolute;left:24px;bottom:110px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid var(--line)}#joyKnob{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px;border-radius:50%;background:rgba(255,255,255,.55)}
